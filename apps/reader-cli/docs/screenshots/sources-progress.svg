<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">命令行阅读器手动扩展书源搜索预览</title>
  <desc id="desc">已知书源页面在手动搜索更多书源时显示进度和 ⎋ 取消提示。</desc>
  <rect width="960" height="520" fill="#0f141a"/>
  <rect x="18" y="16" width="924" height="488" rx="10" fill="#111923" stroke="#334155" stroke-width="2"/>
  <rect x="18" y="16" width="924" height="36" rx="10" fill="#1a2531"/>
  <circle cx="42" cy="34" r="6" fill="#ff6b6b"/><circle cx="62" cy="34" r="6" fill="#ffd166"/><circle cx="82" cy="34" r="6" fill="#8bd450"/>
  <text x="108" y="40" fill="#cbd5e1" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="16">legado-reader — terminal</text>
  <text x="44" y="88" fill="#54d7e8" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="20" font-weight="700">Legado Reader  ·  已知书源</text>
  <text x="900" y="88" text-anchor="end" fill="#8291a4" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="15">1/4 源 · 匹配 1 · 未匹配 1</text>
  <text x="44" y="140" fill="#72e6a8" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="17">+ 1. [可用] 网络书库 · 三体 · 刘慈欣</text>
  <text x="44" y="166" fill="#8291a4" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="15">     最新章节：第三部 · 更新时间：2026-09-22 10:12:23 · 搜索耗时：530ms</text>
  <text x="44" y="198" fill="#72e6a8" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="17">+ 2. [可用] 阅读空间 · 三体 · 刘慈欣</text>
  <text x="44" y="224" fill="#8291a4" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="15">     最新章节：第三部 · 更新时间：2026-09-21 18:20:00 · 搜索耗时：810ms</text>
  <text x="44" y="463" fill="#526274" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="17">────────────────────────────────────────────────────────────</text>
  <text x="44" y="489" fill="#ffd166" font-family="SFMono-Regular,Menlo,Consolas,'Noto Sans Mono',monospace" font-size="16">[⎋] 取消搜索  [?] 帮助</text>
